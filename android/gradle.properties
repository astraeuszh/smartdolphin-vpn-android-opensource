# Gradle 堆太大 + Cursor 同时开 = 整机 OOM（窗口提示 reason: oom）。
# 2G 堆 + 单 worker：更慢，但尽量不在「关 Cursor 前的终端里」把内存打爆。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.java.home=/home/astraeus/.local/jdk-21
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
# 本地 SDK 已齐全，禁止构建时再联网拉 manifest（否则会卡很久）
android.builder.sdkDownload=false

# Disable R8 full mode to preserve TypeToken generic signatures (flutter_local_notifications)
# See: https://github.com/MaikuB/flutter_local_notifications/issues/2392
android.enableR8.fullMode=false

# Disable Kotlin incremental compilation because the Flutter tool cache lives on a
# different drive than the project when developing on Windows. The incremental
# compiler cannot create relative paths across drive letters and fails with
# "this and base files have different roots" when closing its caches.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
