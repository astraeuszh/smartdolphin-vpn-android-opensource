name: smartdolphin_vpn
description: "SmartDolphin VPN Android client"
publish_to: 'none'
version: 3.99.99-dev-beta+39999

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.3
  freezed_annotation: ^2.4.2
  json_annotation: ^4.9.0
  package_info_plus: ^8.0.0
  tutorial_coach_mark: ^1.3.3
  cryptography: ^2.7.0
  dio: ^5.4.0
  google_fonts: ^6.1.0
  equatable: ^2.0.7
  characters: ^1.3.0
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  csv: ^5.0.2
  dart_ping: ^9.0.1
  dart_ping_ios: ^4.0.2
  pool: ^1.5.1
  xml: ^6.5.0
  openvpn_flutter: ^1.3.4
  flutter_local_notifications: ^17.1.2
  flutter_svg: ^2.0.9
  file_picker: ^8.0.3
  app_settings: ^5.1.1
  url_launcher: ^6.2.6
  fl_chart: ^0.69.0
  webview_flutter: ^4.4.2
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  flutter_gen_runner: ^5.3.2
  freezed: ^2.4.2
  json_serializable: ^6.7.1
  flutter_launcher_icons:

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/reference/
    - assets/legal/
    - assets/icons/
    - assets/CountryFlags/
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/appicon.png"
  adaptive_icon_background: "#B8D9F5"
  adaptive_icon_foreground: "assets/icons/appicon.png"
  min_sdk_android: 21
